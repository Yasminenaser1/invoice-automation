name: Process invoices

on:
  schedule:
    - cron: "0 13 * * *"    # every day at 13:00 UTC (8 AM Dallas time)
  push:
    paths:
      - "invoices/**"         # also run when new invoices are uploaded
      - "invoices_scanned/**"
  workflow_dispatch:          # allows a manual run from GitHub or Terminal

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python pipeline.py invoices
          python pipeline.py invoices_scanned
